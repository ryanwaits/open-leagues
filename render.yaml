# Render Blueprint — the public substrate box.
#
# Receipts, open data, the lab, and /api/mcp for anyone. No accounts, no
# leagues, no tokens: OPENLEAGUES_MODE is left unset, which is substrate mode.
# Launch once from the Render dashboard (New → Blueprint → this repo);
# afterwards this file is the source of truth and syncs on push.
#
# To wipe the database before the first substrate deploy (old leagues, users,
# tokens): copy the External Database URL from the open-leagues-pg page and run
#   DATABASE_URL='postgres://…' bun scripts/db-wipe.mjs --yes
# then deploy; `bun run build` re-applies migrations and every table the box
# needs is created on first use.
services:
  - type: web
    name: open-leagues
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /
    autoDeploy: true
    # One instance only — the disk is the database. Deploys pause briefly.
    numInstances: 1
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    domains:
      - leagues.waits.dev
    envVars:
      # Hosted DB: managed Postgres (below). PGLite stays the local/household
      # fallback and never initializes when DATABASE_URL is set — which is
      # what keeps this service inside the 512Mi starter instance.
      - key: DATABASE_URL
        fromDatabase:
          name: open-leagues-pg
          property: connectionString
      - key: VITE_PUBLIC_HOSTNAME
        value: leagues.waits.dev
      # Substrate: no OPENLEAGUES_MODE, no BETTER_AUTH_*, no Google, no VAPID,
      # no self-tick (there are no leagues to tick). Splits stay off publicly.

databases:
  - name: open-leagues-pg
    plan: basic-256mb
    region: virginia   # MUST match the web service — internal DB hostnames
    diskSizeGB: 1      # are region-scoped (oregon DB from the first sync is
                       # orphaned; delete it in the dashboard).
