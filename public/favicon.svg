<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The works-with chip, alone: a small filled box in the neutral ink.
       Fill tracks the viewer's theme so it reads on a light or dark tab. -->
  <style>
    .box { fill: #5c6066; }
    @media (prefers-color-scheme: dark) { .box { fill: #a3a6aa; } }
  </style>
  <rect class="box" x="7" y="7" width="18" height="18" rx="5.5"/>
</svg>
